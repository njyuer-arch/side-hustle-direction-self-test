name: Submit anonymous feedback

on:
  workflow_dispatch:
    inputs:
      tool_version:
        description: "Self-test version"
        required: true
        type: choice
        options:
          - V0.9
      post_report_updates_complete:
        description: "Are all report corrections complete?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      consent_confirmed:
        description: "Did the tester explicitly consent to public GitHub submission?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      summary:
        description: "Final de-identified summary shown to the tester"
        required: true
        type: string
      evaluation:
        description: "Optional tester feedback, de-identified"
        required: false
        type: string

permissions:
  contents: read

jobs:
  submit:
    if: ${{ inputs.post_report_updates_complete == 'yes' && inputs.consent_confirmed == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test feedback writer without production writes
        run: python3 .github/scripts/test_submit_anonymous_feedback.py
      - name: Write anonymous feedback entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL_VERSION: ${{ inputs.tool_version }}
          POST_REPORT_UPDATES_COMPLETE: ${{ inputs.post_report_updates_complete }}
          CONSENT_CONFIRMED: ${{ inputs.consent_confirmed }}
          SUMMARY: ${{ inputs.summary }}
          EVALUATION: ${{ inputs.evaluation }}
        run: python3 .github/scripts/submit_anonymous_feedback.py
